  data_rows:
    -
      nid: 200
      titulo: 'Sobre mí'
      alias: /sobre-mi
      entradilla: 'Dibujo, pintura e ilustración aplicados a las necesidades de tu empresa, tu negocio o tu casa.'
      texto: |
        <p>Estudié Artes Gráficas y me especialicé en encuadernación de lujo, encuadernación antigua y restauración, una formación que da mucha importancia al dibujo.</p>
        <p>Desde 1974 trabajo en el mundo editorial y, por tanto, con todos los sistemas de reproducción según el tipo de original: transparencias, dibujo a lápiz, tinta, acuarela, témperas y óleos, y también con el soporte en el que se iba a imprimir.</p>
        <p>Recibir de forma continua tantos originales en técnicas y soportes distintos me mostró el amplísimo campo en el que se puede aplicar el dibujo o la pintura, dentro y fuera del sector.</p>
        <p>Con los años he utilizado soportes y técnicas diferentes para cada necesidad: no es lo mismo un folleto publicitario que un stand, ni una ilustración para un libro o un cuento que un mural para un restaurante.</p>
        <p>En todo este tiempo he hecho trabajos muy variados: ilustraciones para editoriales, exposiciones de pintura, cuadros personalizados, stands, decoración de interiores para diversos negocios, y murales e interiores para particulares y profesionales.</p>
    -
      nid: 201
      titulo: Encargos
      alias: /encargos
      entradilla: '¿Darle un nuevo aire a tu negocio? ¿Potenciar la personalidad de tu local?'
      texto: '<p>Estas son algunas de las cosas que se pueden hacer. Contacta conmigo sin ningún compromiso: seguro que encontramos la mejor solución.</p>'
