id: jllamas_redirecciones
label: 'Redirecciones desde las URLs de la web antigua'
migration_group: jllamas
source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls:
    - modules/custom/jllamas_migrate/data/redirecciones.json
  item_selector: ''
  fields:
    - { name: id, label: 'Id', selector: id }
    - { name: origen, label: 'URL antigua', selector: origen }
    - { name: destino, label: 'URL nueva', selector: destino }
  ids:
    id:
      type: integer
  constants:
    prefijo: 'internal:'
process:
  redirect_source/path: origen
  redirect_redirect/uri:
    plugin: concat
    source:
      - constants/prefijo
      - destino
  status_code:
    plugin: default_value
    default_value: 301
  language:
    plugin: default_value
    default_value: und
destination:
  plugin: 'entity:redirect'
migration_dependencies:
  optional:
    - jllamas_obras
    - jllamas_paginas
dependencies:
  enforced:
    module:
      - jllamas_migrate
